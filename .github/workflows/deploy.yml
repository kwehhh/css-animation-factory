# Build the factory in GitHub Actions, then rsync the static dist/ to the
# nurvus box as jcage. Served at https://johnyagiz.dev/css-animation-factory/
# by the johnyagiz.dev nginx block (location /css-animation-factory/ →
# /var/www/css-animation-factory/, a jcage-owned dir). Same pattern as
# nurvus-design-system → design.nurvus.ai: build in CI, never on the box, no sudo.
#
# Replaces the old memoryleak.ai workflow, which SSHed to a dead host and
# tried to build there (it failed on every push since 2026-02).
#
# Repo secrets (Settings → Secrets and variables → Actions), the same values
# as in kwehhh/nurvus-design-system: SSH_HOST, SSH_USERNAME, SSH_KEY.
name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# One deploy at a time, in push order.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      # The build script sets NODE_OPTIONS=--openssl-legacy-provider itself.
      - name: Build
        run: npm run build

      - name: Deploy to johnyagiz.dev/css-animation-factory (rsync as jcage)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USERNAME" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::Set the SSH_HOST, SSH_USERNAME and SSH_KEY repo secrets (same values as kwehhh/nurvus-design-system)."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # A wrong SSH_HOST used to hang ~2 min before failing; give up after 20s instead.
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ \
            "$SSH_USERNAME@$SSH_HOST:/var/www/css-animation-factory/"
          echo "Deployed to https://johnyagiz.dev/css-animation-factory/"
